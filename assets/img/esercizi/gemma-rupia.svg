<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Gemma verde sfaccettata stile rupia fantasy">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.06" />
    </radialGradient>
    <linearGradient id="gemBody" x1="20%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gemCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35" />
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="22" fill="url(#bgGlow)" stroke="#10b981" stroke-opacity="0.45" stroke-width="2" />
  <!-- Gemma esagonale allungata -->
  <polygon points="60,15 86,34 86,86 60,105 34,86 34,34" fill="url(#gemBody)" stroke="#065f46" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Sfaccettature laterali -->
  <polygon points="60,15 86,34 73,42 60,31" fill="#a7f3d0" fill-opacity="0.65" />
  <polygon points="60,15 34,34 47,42 60,31" fill="#ecfdf5" fill-opacity="0.7" />
  <polygon points="34,34 47,42 47,78 34,86" fill="#34d399" fill-opacity="0.45" />
  <polygon points="86,34 73,42 73,78 86,86" fill="#065f46" fill-opacity="0.35" />
  <polygon points="34,86 47,78 60,89 60,105" fill="#047857" fill-opacity="0.45" />
  <polygon points="86,86 73,78 60,89 60,105" fill="#064e3b" fill-opacity="0.6" />
  <!-- Faccia centrale luminosa -->
  <polygon points="60,31 73,42 73,78 60,89 47,78 47,42" fill="url(#gemCore)" stroke="#a7f3d0" stroke-width="1.4" />
  <!-- Riflesso di luce -->
  <polygon points="52,44 63,36 65,44 52,55" fill="#ffffff" fill-opacity="0.65" />
