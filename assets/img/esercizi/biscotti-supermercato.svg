<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Tre confezioni di biscotti a confronto per prezzo al chilo">
  <rect x="6" y="6" width="108" height="108" rx="22" fill="#f59e0b" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="2" />
  <!-- Confezione A (250g) -->
  <rect x="16" y="58" width="24" height="38" rx="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2" />
  <text x="28" y="74" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="800" fill="#0f172a">250g</text>
  <text x="28" y="88" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#1e3a8a">A</text>
  <!-- Confezione B (400g) -->
  <rect x="46" y="46" width="27" height="50" rx="5" fill="#34d399" stroke="#065f46" stroke-width="2" />
  <text x="59.5" y="68" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="800" fill="#0f172a">400g</text>
  <text x="59.5" y="86" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#064e3b">B</text>
  <!-- Confezione C (500g) -->
  <rect x="78" y="34" width="28" height="62" rx="5" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
  <text x="92" y="61" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="800" fill="#111827">500g</text>
  <text x="92" y="84" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#78350f">C</text>
  <!-- Bollino -20% su C -->
  <circle cx="98" cy="34" r="13" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.8" />
  <text x="98" y="37.5" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="800" fill="#ffffff">-20%</text>
  <!-- Biscottino decorativo in alto a sinistra -->
  <circle cx="31" cy="34" r="11" fill="#d97706" stroke="#78350f" stroke-width="1.8" />
  <circle cx="27" cy="31" r="1.7" fill="#451a03" />
  <circle cx="35" cy="32" r="1.6" fill="#451a03" />
  <circle cx="31" cy="38" r="1.8" fill="#451a03" />
  <circle cx="26" cy="38" r="1.3" fill="#451a03" />
</svg>
