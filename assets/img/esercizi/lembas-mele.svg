<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pan di via dorato avvolto in foglia verde e mela rossa">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="22" fill="#22c55e" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.45" stroke-width="2" />
  <!-- Grande foglia verde esterna che avvolge il panetto -->
  <path d="M18 68 C16 36, 44 18, 84 22 C88 54, 72 86, 36 92 C25 93, 19 82, 18 68 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="2.4" />
  <path d="M22 72 Q52 54 81 25" fill="none" stroke="#86efac" stroke-width="1.6" stroke-opacity="0.7" />
  <!-- Panetto dorato (stile pan di via) -->
  <g transform="rotate(-12 52 56)">
    <rect x="30" y="36" width="44" height="38" rx="8" fill="url(#breadGrad)" stroke="#78350f" stroke-width="2.2" />
    <!-- Incisioni a croce sulla superficie dorata -->
    <line x1="36" y1="43" x2="68" y2="67" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65" />
    <line x1="68" y1="43" x2="36" y2="67" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65" />
    <!-- Spago che lega l'involto -->
    <line x1="52" y1="32" x2="52" y2="78" stroke="#fef3c7" stroke-width="2.6" stroke-dasharray="4 2" />
  </g>
  <!-- Lembo della foglia ripiegato in basso -->
  <path d="M22 70 C36 62, 54 66, 66 78 C52 90, 32 92, 22 70 Z" fill="#16a34a" stroke="#14532d" stroke-width="2" />
  <!-- Mela rossa accanto -->
  <circle cx="85" cy="81" r="17" fill="url(#appleGrad)" stroke="#7f1d1d" stroke-width="2.2" />
  <ellipse cx="79" cy="75" rx="4" ry="6" fill="#ffffff" fill-opacity="0.35" transform="rotate(-20 79 75)" />
  <path d="M85 64 C85 57, 90 54, 93 55" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
  <path d="M86 62 C92 56, 99 58, 97 64 C93 66, 88 65, 86 62 Z" fill="#4ade80" stroke="#14532d" stroke-width="1.4" />
</svg>
