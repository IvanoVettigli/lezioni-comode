<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Zaino da escursione con cartellino sconto 15 percento">
  <defs>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="22" fill="#3b82f6" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="2" />
  <!-- Maniglia superiore -->
  <path d="M44 30 C44 19, 64 19, 64 30" fill="none" stroke="#93c5fd" stroke-width="4.5" stroke-linecap="round" />
  <!-- Corpo zaino -->
  <rect x="26" y="30" width="56" height="68" rx="16" fill="url(#packGrad)" stroke="#1e3a8a" stroke-width="2.5" />
  <!-- Patta superiore -->
