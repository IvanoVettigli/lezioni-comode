  <line x1="41" y1="71" x2="67" y2="71" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />
  <!-- Cinghie fibbia -->
  <rect x="49" y="51" width="10" height="10" rx="2.5" fill="#fbbf24" stroke="#78350f" stroke-width="1.5" />
  <!-- Cartellino sconto -15% -->
  <g transform="rotate(14 90 48)">
    <line x1="76" y1="42" x2="83" y2="42" stroke="#fde68a" stroke-width="2" />
    <path d="M81 32 L106 32 L112 43 L106 54 L81 54 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2" stroke-linejoin="round" />
    <circle cx="86" cy="43" r="2.2" fill="#78350f" />
    <text x="97" y="47" text-anchor="middle" font-family="monospace" font-size="11" font-weight="800" fill="#111827">-15%</text>
